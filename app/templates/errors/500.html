<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - Internal Server Error | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0a0b0f; color:#f1f5f9; font-family:'Inter',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; }
    .error-card { max-width:500px; padding:40px; background:#141720; border:1px solid rgba(99,102,241,0.2); border-radius:20px; box-shadow:0 8px 40px rgba(0,0,0,0.5); }
    .error-code { font-size:6rem; font-family:'Space Grotesk',sans-serif; font-weight:900; background:linear-gradient(135deg,#6366f1,#8b5cf6,#06b6d4); -webkit-background-clip:text; -webkit-text-fill-color:transparent; line-height:1; margin-bottom:12px; }
    .error-title { font-size:1.5rem; margin-bottom:12px; font-family:'Space Grotesk',sans-serif; }
    .error-desc { color:#94a3b8; font-size:0.95rem; line-height:1.6; margin-bottom:28px; }
    .btn-home { display:inline-flex; align-items:center; gap:8px; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; text-decoration:none; padding:12px 24px; border-radius:10px; font-weight:600; transition:0.2s ease; }
    .btn-home:hover { transform:translateY(-2px); box-shadow:0 4px 20px rgba(99,102,241,0.4); }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">500</div>
    <h1 class="error-title">Internal Server Error</h1>
    <p class="error-desc">An unexpected error occurred on the server. Please try again later.</p>
    <a href="/" class="btn-home"><i class="fas fa-home"></i> Return to Portfolio</a>
  </div>
</body>
</html>
